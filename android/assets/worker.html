<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Фоновая проверка</title></head>
<body>
<script src="engine2.js"></script>
<script src="data.js"></script>
<script>
// Фоновая проверка сигналов: запускается Android по расписанию, без окна.
(async function () {
  const A = window.Android;
  const log = (m) => { try { A && A.log(m); } catch (e) { /* нет моста */ } };
  try {
    EWData.logInit('log_bg.json');
    const t0 = Date.now();
    EWData.store.set('lastbg', { at: t0, ok: false, running: true });
    const ev = await EWData.checkAll(log, { budgetMs: 6 * 60000 });   // бумаги — не дольше 6 мин, остальное время — уровням и роботам
    EWData.store.set('lastbg', { at: Date.now(), ok: true, events: ev.length, sec: Math.round((Date.now() - t0) / 1000) });
    EWData.log('bg', 'фоновая проверка: готово за ' + Math.round((Date.now() - t0) / 1000) + ' с, событий ' + ev.length);
    let id = 100 + (Date.now() % 1000);
    for (const e of ev) { try { if (A && A.notifyOpen) A.notifyOpen(e.title, e.text, id++, e.open ? JSON.stringify(e.open) : ''); else if (A) A.notify(e.title, e.text, id++); } catch (x) { log('notify: ' + x.message); } }
    log('проверка: событий ' + ev.length);
  } catch (e) {
    log('ошибка проверки: ' + e.message);
    EWData.store.set('lastbg', { at: Date.now(), ok: false, err: (e && e.message) || String(e) });
    EWData.log('error', 'фоновая проверка: ' + ((e && e.message) || String(e)), { stack: e && e.stack ? String(e.stack).slice(0, 800) : undefined });
  } finally {
    try { EWData.logFlush(); } catch (e) { /* не важно */ }
    try { A && A.done(); } catch (e) { /* нет моста */ }
  }
})();
</script>
</body>
</html>
