<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Волны Эллиотта</title>
<style>
:root {
  --bg: #14181e; --bg2: #1b2028; --bg3: #232a34; --line: #2e3744; --ink: #e8ecf1; --mut: #8d98a6; --dim: #5f6a78;
  --pos: #3fbf7f; --neg: #ef5b5b; --blue: #5b9cff; --warn: #f0a23a; --gold: #d9b443; --violet: #b07cf0; --teal: #35b8b0;
  --hud: rgba(20,24,30,.86); --acc: #2b4a7a; --accl: #3f6fb3;
  --r: 10px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { overflow: hidden; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 system-ui, -apple-system, Roboto, sans-serif; overscroll-behavior: none; }
body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
button { font: inherit; color: inherit; background: var(--bg3); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
button:active { filter: brightness(1.3); }
button.on { background: var(--acc); border-color: var(--accl); }
input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
[hidden] { display: none !important; }
.mono { font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .mut { color: var(--mut); } .warn { color: var(--warn); } .blue { color: var(--blue); } .gold { color: var(--gold); } .violet { color: var(--violet); }

/* шапка */
header { display: flex; align-items: center; gap: 6px; padding: 6px 8px; padding-top: max(6px, env(safe-area-inset-top)); background: var(--bg2); border-bottom: 1px solid var(--line); flex: none; }
#instBtn { display: flex; flex-direction: column; align-items: flex-start; padding: 3px 9px; min-width: 0; max-width: 34%; }
#instBtn b { font-size: 15px; }
#instBtn small { color: var(--mut); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#tfBtn { flex: none; padding: 7px 10px; font-size: 14px; font-weight: 600; }
.hsp { flex: 1; }
.icon { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; flex: none; font-size: 17px; position: relative; }
body > header { gap: 4px; }
body > header .icon { width: 32px; }
/* 2.41: роботы с настроением, колокольчик, гонка, салют (всё выключается: ⚙ → Данные → «Анимации») */
#robBtn .cnt, .rcnt { position: absolute; right: -3px; top: -3px; min-width: 15px; height: 15px; border-radius: 8px; background: #5b9cff; color: #fff; font-size: 10px; font-weight: 700; line-height: 15px; padding: 0 3px; }
.bot { width: 26px; height: 26px; overflow: visible; display: block; }
.bot.big { width: 46px; height: 46px; flex: none; }
.bot * { transform-box: fill-box; transform-origin: center; }
.bot .bot-ant { transform-origin: 50% 100%; animation: botSway 3s ease-in-out infinite; }
.bot .bot-eyes { animation: botBlink 4s infinite; }
.bot .bot-led { fill: #f5d742; }
.bot .m-s, .bot .m-f, .bot .bot-z { display: none; }
.bot.m-happy .m-n, .bot.m-sad .m-n, .bot.m-sleep .m-n { display: none; }
.bot.m-happy .m-s, .bot.m-sad .m-f, .bot.m-sleep .bot-z { display: inline; }
.bot.m-happy .bot-b { animation: botJump .7s ease-in-out infinite; }
.bot.m-happy .bot-led { fill: #3fbf7f; }
.bot.m-sad .bot-ant { animation: none; transform: rotate(35deg); }
.bot.m-sad .bot-led { fill: #4fc3f7; }
.bot.m-sad .bot-eyes { animation: none; transform: translateY(1px); }
.bot.m-sleep .bot-eyes { animation: none; transform: scaleY(.15); }
.bot.m-sleep .bot-ant { animation: none; }
.bot.m-sleep .bot-led { fill: #5d6875; }
.bot.m-sleep .bot-z { animation: botZ 2.4s ease-in infinite; }
.bot.m-think .bot-led { animation: botLed .5s steps(2) infinite; fill: #f0a23a; }
.bot.m-think .bot-eyes { animation: botLook 1.2s ease-in-out infinite; }
.bot.m-think .bot-b { animation: botTilt 1.2s ease-in-out infinite; }
.bot .bot-fire { animation: botFire .35s ease-in-out infinite alternate; }
/* стрелка крутится вокруг центра циферблата (20, 19); с центром 0 0 она летала вокруг робота «мухой» (2.41) */
.bot .bot-hand { animation: botTick 4s steps(8) infinite; transform-origin: 20px 19px; transform-box: view-box; }
@keyframes botSway { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
@keyframes botBlink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes botJump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-3px); } }
@keyframes botZ { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(4px, -6px); } }
@keyframes botLed { 50% { fill: #fff3b0; } }
@keyframes botLook { 0%, 100% { transform: translateX(-1.2px); } 50% { transform: translateX(1.2px); } }
@keyframes botTilt { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@keyframes botFire { from { transform: scale(.85) translateY(.5px); } to { transform: scale(1.1) translateY(-.5px); } }
@keyframes botTick { to { transform: rotate(360deg); } }
#bellBtn.ring { animation: bellRing 1s ease-in-out 3; transform-origin: 50% 10%; }
#bellBtn.wig { animation: bellRing .6s ease-in-out 1; transform-origin: 50% 10%; }
@keyframes bellRing { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(18deg); } 30% { transform: rotate(-16deg); } 45% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 75% { transform: rotate(4deg); } }
.rsay { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.rsay .bub { position: relative; flex: 1; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 13px; }
.rsay .bub:before { content: ''; position: absolute; left: -7px; top: 14px; border: 6px solid transparent; border-right-color: var(--line); border-left: 0; }
/* 3.4: экран «Роботы» — панель внизу, цвет робота */
.robnav { position: relative; flex: none; display: flex; gap: 2px; padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); background: var(--bg2); border-top: 1px solid var(--line); }
.robnav[hidden] { display: none; }
.rnb { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 2px 4px; background: none; border: 0; border-top: 3px solid transparent; border-radius: 6px 6px 8px 8px; color: var(--mut); }
.rnb.on { background: color-mix(in srgb, var(--rc) 18%, transparent); border-top-color: var(--rc); color: var(--ink); }
.rnb .bot, .rnb .me { width: 24px; height: 24px; font-size: 18px; line-height: 24px; text-align: center; }
.rnb span { font-size: 10.5px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.rnb small { font-size: 10px; line-height: 1.1; }
.rnb .rdot { position: absolute; top: 3px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: #f5d742; box-shadow: 0 0 0 2px var(--bg2); }
.robmore { position: absolute; left: 6px; right: 6px; bottom: calc(100% + 4px); display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; background: var(--bg3); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 -6px 18px rgba(0,0,0,.35); }
.robmore .rnb { flex: 0 0 calc(25% - 3px); }
.rrow { display: flex; align-items: center; gap: 8px; padding: 8px 6px 8px 8px; margin: 4px 0; border-left: 4px solid var(--rc); border-radius: 6px; background: color-mix(in srgb, var(--rc) 8%, transparent); cursor: pointer; }
.rrow .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rrow small { color: var(--mut); font-size: 11px; }
.rrow .me { font-size: 20px; width: 26px; text-align: center; }
.sigc { color: #f5d742; }
.card.robhd { border-left: 4px solid var(--rc); background: linear-gradient(90deg, color-mix(in srgb, var(--rc) 12%, var(--bg2)), var(--bg2) 70%); }
.card.robhd h3 { color: var(--rc); font-size: 14px; text-transform: none; letter-spacing: 0; }
.card.pendc { border-color: #a8902a; background: color-mix(in srgb, #f5d742 10%, var(--bg2)); }
.card.pendc h3 { color: #f5d742; }
.jrow.jp, .jrow.jn, .jrow.jz { border-left: 3px solid; padding-left: 8px; }
.jrow.jp { border-left-color: #3fbf7f; } .jrow.jn { border-left-color: #ef5b5b; } .jrow.jz { border-left-color: var(--dim); }
.jrow.jc.jp { background: rgba(63,191,127,.06); } .jrow.jc.jn { background: rgba(239,91,91,.06); }
.shrt { font-size: 11px; padding: 0 5px; border-radius: 4px; background: rgba(239,91,91,.18); color: #ff8a8a; }
.race { display: flex; align-items: center; gap: 6px; height: 40px; margin: 2px 0; border-bottom: 1px dashed var(--line); }
.race .lname { width: 92px; flex: none; font-size: 11px; color: var(--mut); line-height: 1.2; }
.race .track { position: relative; flex: 1; height: 100%; }
.race .lane0 { position: absolute; top: 2px; bottom: 2px; width: 0; border-left: 2px solid var(--mut); opacity: .5; }
.race .runner { position: absolute; top: 2px; transform: translateX(-50%); transition: left 1.6s cubic-bezier(.2, .8, .2, 1); display: flex; flex-direction: column; align-items: center; }
.race .runner .bot, .race .runner .me { width: 24px; height: 24px; font-size: 18px; line-height: 24px; }
.race .runner small { font-size: 10px; color: var(--mut); white-space: nowrap; margin-top: -2px; }
.race .fin { position: absolute; right: 0; top: 10px; font-size: 14px; }
.wk { display: inline-block; animation: wkBounce 1.4s ease-in-out infinite; }
@keyframes wkBounce { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-2px) rotate(6deg); } }
.feed { font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.feed time { color: var(--mut); margin-right: 6px; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.ach div { text-align: center; padding: 6px 4px; border: 1px solid var(--line); border-radius: 10px; font-size: 11px; color: var(--mut); }
.ach div b { display: block; font-size: 24px; filter: grayscale(1) opacity(.35); }
.ach div.got { color: var(--ink); border-color: var(--gold); }
.ach div.got b { filter: none; }
.ach div.new b { animation: achPop .8s ease-out 2; }
@keyframes achPop { 0% { transform: scale(.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
#sigPulse { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #5b9cff; pointer-events: none; z-index: 2; }
#sigPulse:after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid #5b9cff; animation: sigPulse 1.4s ease-out infinite; }
@keyframes sigPulse { from { transform: scale(1); opacity: 1; } to { transform: scale(3.2); opacity: 0; } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
body.noanim *, body.noanim *:before, body.noanim *:after { animation: none !important; transition: none !important; }
#bellBtn { filter: grayscale(1) opacity(.55); }
#bellBtn.on { filter: none; border-color: var(--gold); }
#bellBtn .cnt { position: absolute; right: -3px; top: -3px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--gold); color: #14181e; font-size: 10px; font-weight: 700; line-height: 15px; padding: 0 3px; }
#pop .plv { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
#pop .plv span { flex: 1; }
#pop .plv.fired span { color: var(--dim); }
#pop .padd { display: flex; gap: 6px; padding: 8px 4px 4px; }
#pop .padd input { flex: 1; min-width: 0; }
#pop .pnote { font-size: 12px; color: var(--mut); padding: 4px 8px; }
#pop .plink { width: 100%; margin-top: 6px; font-size: 13px; }
#pop .swbig { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 4px 4px 2px; }
#pop .swbig b { font-size: 24px; min-width: 96px; text-align: center; }
#pop .swbig button { width: 52px; height: 44px; font-size: 22px; touch-action: none; user-select: none; }
#pop input[type=range] { width: 100%; padding: 0; border: 0; background: none; height: 36px; accent-color: var(--blue); }
#pop .swticks { position: relative; height: 14px; font-size: 10px; color: var(--dim); margin: 0 2px; }
#pop .swticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
#pop .swticks span:first-child { transform: none; margin-left: -10px; } #pop .swticks span:last-child { transform: translateX(-100%); margin-left: 10px; }
.retbars { display: flex; gap: 2px; height: 64px; margin: 8px 0 4px; border-bottom: 0; position: relative; }
.retbars .rb { flex: 1; position: relative; padding: 0; border: 1px solid transparent; border-radius: 3px; background: var(--bg); min-width: 0; height: 100%; }
.retbars .rb i { position: absolute; left: 1px; right: 1px; border-radius: 2px; min-height: 1px; }
.retbars .rb i.p { background: var(--pos); } .retbars .rb i.n { background: var(--neg); }
.retbars .rb.few i { opacity: .3; }
.retbars .rb.cur { border-color: var(--blue); background: #1d2a40; }
.retbars .rb.best { border-color: var(--gold); }
.chips button[data-sw] { touch-action: none; user-select: none; min-width: 34px; }

/* график */
#chartWrap { position: relative; flex: none; height: 50vh; background: var(--bg); touch-action: none; overflow: hidden; }
#chartWrap.anim { transition: height .18s ease-out; }
#grip { flex: none; height: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--bg2); border-top: 1px solid var(--line); touch-action: none; position: relative; }
#grip::before { content: ""; position: absolute; left: 0; right: 0; top: -3px; bottom: -3px; }
#grip .bar { width: 64px; height: 5px; border-radius: 3px; background: var(--dim); }
#grip.drag .bar { background: var(--blue); }
#grip.mini { height: 32px; }
#gripQuote { position: absolute; left: 10px; font-size: 13px; color: var(--mut); display: none; }
#grip.mini #gripQuote { display: block; }
#gripQuote b { color: var(--ink); }
#chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#quote { position: absolute; left: 8px; top: 6px; font-size: 12px; color: var(--mut); pointer-events: none; text-shadow: 0 0 4px var(--bg); }
#quote b { color: var(--ink); font-size: 14px; }
#hud { position: absolute; left: 8px; top: 24px; max-width: calc(100% - 74px); font-size: 11px; line-height: 1.35; background: var(--hud); border: 1px solid rgba(255,255,255,.06); border-radius: 6px; padding: 3px 7px; color: var(--ink); z-index: 2; }
#hud .hudT { float: right; margin: -3px -7px 0 4px; padding: 2px 9px 6px 12px; font-size: 13px; line-height: 1.2; color: var(--mut); }
#hud.mini { max-width: calc(100% - 74px); }
#hud > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hud .h1 { color: var(--mut); }
#hud > div.lt { white-space: normal; }
#trQuick { position: absolute; left: 8px; bottom: 24px; display: flex; gap: 6px; z-index: 3; }
#trQuick button { min-width: 74px; padding: 5px 10px; font-size: 13px; font-weight: 700; line-height: 1.1; border-radius: 8px; opacity: .92; display: flex; flex-direction: column; align-items: center; }
#trQuick button small { font-size: 10px; font-weight: 400; opacity: .85; }
#trQuick .qs { background: #4a1f24; border: 1px solid #a03a46; color: #ffd9dd; }
#trQuick .qb { background: #1f4a33; border: 1px solid #3a9a66; color: #d6ffe6; }
#cinfo { position: absolute; z-index: 4; left: 8px; top: 26px; max-width: calc(100% - 74px); background: rgba(27,32,40,.92); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; font-size: 11px; pointer-events: none; }
#ctxMenu { position: absolute; z-index: 5; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.4); font-size: 13px; }
#ctxMenu button { display: block; width: 100%; text-align: left; margin: 2px 0; }
#busy { position: absolute; right: 64px; top: 6px; font-size: 12px; color: var(--warn); }

/* переключатели разметки */
.chips { display: flex; gap: 5px; padding: 6px 8px; overflow-x: auto; background: var(--bg2); border-bottom: 1px solid var(--line); flex: none; scrollbar-width: none; touch-action: pan-x; }
.chips .grow { flex: 1; }
/* тренажёр */
#trBar { flex: none; background: #1d2433; border-bottom: 1px solid var(--line); padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; }
#trBar .row { gap: 6px; flex-wrap: nowrap; }
#trBar button { padding: 7px 10px; font-size: 14px; flex: none; }
#trBar .spdg { flex: 1; display: flex; gap: 4px; min-width: 0; }
#trBar .spdg button { flex: none; min-width: 40px; font-size: 20px; font-weight: 700; padding-left: 0; padding-right: 0; }
#trBar .spdg .spdv { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; background: #22314a; border-color: #3f6fb3; }
#trBar .spdg .spdv small { margin-left: 4px; font-size: 11px; opacity: .8; }
body.training.chartfull #trBar { position: relative; }
body.training.chartfull #trBar > :not(.row:first-child) { display: none; }
body.training.chartfull #trBar > .warn { display: block; position: absolute; left: 8px; right: 8px; bottom: calc(100% + 6px); background: rgba(29,36,51,.94); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; z-index: 5; }
#trBar .inf { font-size: 12px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
#trBar .plist { max-height: 168px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
#trBar .psum { cursor: pointer; }
details.trev { margin-top: 8px; } details.trev summary { font-size: 13px; color: var(--mut); padding: 4px 0; }
details.trev .small { padding: 2px 0; border-bottom: 1px solid var(--line); }
#trBar .prow { border-radius: 8px; padding: 1px 2px; }
#trBar .prow.sel { background: rgba(91,156,255,.12); box-shadow: inset 2px 0 0 #5b9cff; }
#trBar .tin { flex: 1; min-width: 0; padding: 6px 6px; font-size: 13px; }
#trBar .buy { background: #1f4a33; border-color: #2f7a52; } #trBar .sell { background: #4a1f24; border-color: #7a2f38; }
body.training #chips { display: none; }
#viewBtn i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-left: 1px; vertical-align: 1px; }

/* всплывающие меню: вид графика, таймфрейм */
#pop .trplan { padding: 4px 6px; max-width: 360px; } #pop .trplan .plan { margin-top: 6px; }
#pop { position: fixed; z-index: 30; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.5); min-width: 230px; max-width: calc(100vw - 16px); overflow-y: auto; }
#pop .pgrp { color: var(--mut); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 8px 8px 4px; }
#pop .pitem { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 10px 8px; font-size: 14px; }
#pop .pitem:active { background: var(--bg3); }
#pop .pitem .ck { width: 20px; height: 20px; flex: none; border-radius: 5px; border: 2px solid var(--dim); display: grid; place-items: center; font-size: 13px; line-height: 1; }
#pop .pitem.on .ck { background: var(--blue); border-color: var(--blue); }
#pop .pitem.pbig { background: #22314a; border: 1px solid #3f6fb3; margin: 2px 0 6px; padding: 12px 10px; font-weight: 600; box-shadow: 0 2px 0 #16213a; transition: transform .06s, box-shadow .06s, filter .06s; }
#pop .pitem.pbig small { font-weight: 400; }
#pop .pitem.pbig:active { transform: translateY(2px); box-shadow: 0 0 0 #16213a; filter: brightness(1.25); }
button:active { transform: translateY(1px); }
#pop.wide { left: 8px !important; right: 8px; max-width: none; }
#pop .tgs { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 4px; align-items: center; }
#pop .tg { padding: 7px 10px; font-size: 13px; border-radius: 16px; background: var(--bg3); border: 1px solid var(--line); color: var(--mut); }
#pop .tg.on { color: var(--fg, #e6e9ee); background: #22314a; border-color: #3f6fb3; }
#pop .tgsep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
#pop .pitem .lsw { display: block; padding: 0; width: 18px; height: 3px; flex: none; border-radius: 2px; margin-left: -4px; }
#pop .pitem .n { margin-left: auto; color: var(--mut); font-size: 12px; }
#pop .seg { display: flex; gap: 4px; padding: 2px 4px 6px; }
#pop .seg button { flex: 1; font-size: 13px; padding: 8px 4px; }
#pop .tfgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; }
#pop .tfgrid button { padding: 12px 6px; font-size: 15px; }
#pop .tfgrid button small { display: block; font-size: 10px; color: var(--mut); margin-top: 2px; }

/* вкладки настроек */
.stabs { display: flex; gap: 4px; padding: 8px 10px; background: var(--bg2); border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; scrollbar-width: none; }
.stabs::-webkit-scrollbar { display: none; }
.stabs button { flex: 1 0 auto; padding: 8px 10px; font-size: 13px; position: relative; }
.stabs button .dot { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.card .sw:last-child { border-bottom: 0; }
.card > .field:last-child { margin-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; font-size: 12px; padding: 5px 9px; border-radius: 14px; }
.chips .chipstat { flex: none; display: flex; flex-direction: column; justify-content: center; font-size: 13px; font-weight: 600; line-height: 1.1; padding: 0 2px; }
.chips .chipstat small { font-size: 10px; font-weight: 400; color: var(--mut); }
.chips .sep { width: 1px; background: var(--line); flex: none; margin: 2px 2px; }

/* панель */
#panel { flex: 1; overflow-y: auto; padding: 8px 8px 45vh; -webkit-overflow-scrolling: touch; }
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin-bottom: 8px; }
.card h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--mut); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
.card h3 .grow { flex: 1; }
/* 2.42: сворачиваемые карточки — нажатие на заголовок */
.card.fold > h3 { cursor: pointer; user-select: none; -webkit-user-select: none; }
.card.fold > h3:after { content: '▾'; flex: none; font-size: 13px; color: var(--mut); }
.card.fold.folded > h3:after { content: '▸'; }
.card.fold.folded > h3 { margin-bottom: 0; }
.card.fold.folded > :not(h3) { display: none !important; }
[data-ropen], [data-wgo], .jrow[data-rgo] { cursor: pointer; }
#trBar .trps { cursor: pointer; background: #24304a; border-radius: 6px; padding: 4px 8px; }
#trBar .trps .inf { white-space: normal; color: var(--ink); }
#nowCard .plan + .big { margin-top: 10px; }
#nowCard h3 .small { text-transform: none; letter-spacing: 0; font-weight: 400; text-align: right; }
.sw small .hist { display: block; font-style: normal; margin-top: 4px; padding-left: 8px; border-left: 2px solid var(--line); }
.rules { margin-top: 6px; } .rules .rl { display: flex; gap: 6px; font-size: 13px; line-height: 1.35; margin-top: 2px; } .rules .rl b { flex: none; width: 14px; text-align: center; } .rules .rl:not(.neg):not(.warn):not(.mut) b { color: var(--pos); }
ul.bul { margin: 6px 0 0; padding-left: 18px; } ul.bul li { margin-top: 3px; }
.skins { display: flex; flex-direction: column; gap: 6px; }
.skins .pitem, #pop .pitem[data-skin] { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; }
.skinsw { flex: none; width: 34px; height: 24px; border-radius: 6px; border: 2px solid; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0; }
.skinsw i { width: 5px; height: 13px; border-radius: 1px; display: block; }
.big { font-size: 16px; font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; margin: 6px 0; }
.kv div small { display: block; color: var(--mut); font-size: 11px; }
.kv div b { font-size: 15px; }
.plan { border-left: 3px solid var(--blue); padding-left: 9px; margin-top: 8px; }
.plan.buy { border-color: var(--pos); } .plan.sell { border-color: var(--neg); }
.exit { margin-top: 6px; font-weight: 600; color: var(--warn); }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { padding: 4px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--mut); font-weight: 500; }
th:first-child, td:first-child { text-align: left; }
tr.cur td { color: var(--blue); }
tr.sel td { background: #24324a; }
.tlist tr { cursor: pointer; }
.small { font-size: 12px; color: var(--mut); }
.note { font-size: 12px; color: var(--warn); margin-top: 6px; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { min-width: 38px; }
.banner { background: #3a2f17; border: 1px solid #6b5422; color: #f3d48a; border-radius: var(--r); padding: 9px 12px; margin-bottom: 8px; font-size: 13px; }
.err { background: #3a1c1c; border-color: #6b2a2a; color: #f5b1b1; }

/* листы поверх: настройки и поиск */
.sheet { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; }
.sheet header b { flex: 1; font-size: 16px; }
.sheet .body { flex: 1; overflow-y: auto; padding: 10px 10px 40px; }
/* 3.8: инструкция (manual.html) — экраном поверх остальных, кнопки 📖 открывают нужный раздел */
#manFrame { flex: 1; display: block; width: 100%; min-height: 0; border: 0; background: var(--bg); }
#manBtn { flex: none; padding: 6px 10px; font-size: 14px; }
.manl { display: block; margin: 10px auto 0; padding: 8px 14px; font-size: 14px; }
.field { margin-bottom: 12px; }
.field label { display: block; color: var(--mut); font-size: 12px; margin-bottom: 4px; }
.sw { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sw input { width: 22px; height: 22px; flex: none; margin-top: 1px; accent-color: var(--blue); }
.sw span small { display: block; color: var(--mut); font-size: 12px; }
.grp { color: var(--blue); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 4px; }
.res { padding: 10px; border-bottom: 1px solid var(--line); }
.res b { margin-right: 6px; }
.star { display: inline-block; width: 34px; margin: -10px 4px -10px -10px; padding: 10px 0 10px 10px; color: var(--dim); font-size: 18px; }
.star.on, #favBtn.fav { color: var(--gold); }
.scan td, .scan th { padding: 6px 3px; }
.scan td:first-child { white-space: normal; min-width: 92px; }
.scan td:first-child .small { font-size: 11px; }
.scan tr { cursor: pointer; }
.scan .mut td { color: var(--dim); }
.sheet .body { overflow-x: hidden; }
table.cmp { margin-top: 4px; table-layout: fixed; }
table.cmp td, table.cmp th { padding: 6px 3px; }
table.cmp th:first-child, table.cmp td:first-child { width: 44%; white-space: normal; }
table.cmp tr[data-scan] { cursor: pointer; }
table.cmp small { font-size: 10px; }
.chk { font-size: 10px; letter-spacing: -1px; white-space: nowrap; } .chk i { font-style: normal; color: var(--neg); } .chk i.ok { color: var(--pos); }
.sortb button { font-size: 12px; padding: 4px 8px; border-radius: 12px; }
.spark { vertical-align: middle; }
body.chartbig #panel { padding-bottom: 8px; }
body.chartfull #panel { display: none; }
.jform .field { margin-bottom: 8px; }
.jform .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.jrow { padding: 8px 0; border-bottom: 1px solid var(--line); }
.jrow .row { justify-content: space-between; }
.watch { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.watch span { flex: 1; }
/* 3.6: программа для компьютера в широком окне — график слева на всю высоту, панель справа, экраны выезжают справа */
body.desk { display: grid; grid-template-columns: minmax(0, 1fr) 460px; grid-template-rows: auto auto auto minmax(0, 1fr); }
body.desk > header { grid-column: 1 / -1; }
body.desk #chartWrap { grid-column: 1; grid-row: 2 / 5; height: auto !important; border-right: 1px solid var(--line); }
body.desk #grip { display: none; }
body.desk #chips { grid-column: 2; grid-row: 2; }
body.desk #trBar { grid-column: 2; grid-row: 3; }
body.desk #panel { grid-column: 2; grid-row: 4; padding-bottom: 24px; }
body.desk .sheet { left: auto; width: min(640px, 100vw); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,.45); }
body.desk #robots { width: min(860px, 100vw); }
body.desk #manual { width: min(900px, 100vw); }
body.desk button, body.desk [role="button"], body.desk label.sw { cursor: pointer; }
body.desk ::-webkit-scrollbar { width: 10px; height: 10px; }
body.desk ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
body.desk ::-webkit-scrollbar-track { background: transparent; }
@media (min-width: 1600px) { body.desk { grid-template-columns: minmax(0, 1fr) 540px; } }
</style>
</head>
<body>
<header>
  <button id="instBtn" aria-label="Выбрать бумагу"><b id="instTicker">SBER</b><small id="instName">Сбербанк</small></button>
  <button id="tfBtn" aria-label="Таймфрейм">1ч ▾</button>
  <span class="hsp"></span>
  <button class="icon" id="favBtn" aria-label="В избранное">☆</button>
  <button class="icon" id="bellBtn" aria-label="Оповещения по бумаге">🔔</button>
  <button class="icon" id="refreshBtn" aria-label="Обновить">⟳</button>
  <button class="icon" id="robBtn" aria-label="Роботы"></button>
  <button class="icon" id="jrnBtn" aria-label="Мои сделки">📒</button>
  <button class="icon" id="setBtn" aria-label="Настройки">⚙</button>
</header>

<div id="chartWrap">
  <canvas id="chart"></canvas>
  <div id="quote"></div>
  <div id="hud" hidden></div>
  <div id="sigPulse" hidden></div>
  <div id="trQuick" hidden></div>
  <div id="cinfo" hidden></div>
  <div id="busy" hidden>загрузка…</div>
  <div id="ctxMenu" hidden></div>
</div>

<div id="grip" aria-label="Потяните вверх или вниз, чтобы изменить размер графика; двойное касание — график на весь экран"><span class="bar"></span><span id="gripQuote"></span></div>
<div class="chips" id="chips"></div>
<div id="trBar" hidden></div>

<main id="panel" aria-live="polite"></main>
<div id="pop" hidden></div>

<!-- поиск бумаги -->
<section class="sheet" id="search" hidden>
  <header><button class="icon" data-close="search" aria-label="Назад">←</button><b>Бумага</b><button id="scanOpen">Сканер</button></header>
  <div class="body">
    <div class="field"><input id="q" placeholder="Тикер или название: SBER, Газпром…" autocomplete="off"></div>
    <div class="small" id="qhint">Ищет сразу по всем акциям Мосбиржи из списка сканера, остальные бумаги — у брокера.</div>
    <div id="qres"></div>
  </div>
</section>

<!-- мои сделки (дневник) -->
<section class="sheet" id="journal" hidden>
  <header><button class="icon" data-close="journal" aria-label="Назад">←</button><b>📒 Мои сделки</b><button class="icon" data-man="mytrades" aria-label="Инструкция">📖</button><button id="jrnAdd">+ Сделка</button></header>
  <div class="body" id="jrnBody"></div>
</section>

<!-- роботы (виртуальные счета) -->
<section class="sheet" id="robots" hidden>
  <header><button class="icon" data-close="robots" aria-label="Назад">←</button><b>🤖 Роботы</b><button class="icon" data-man="robots" aria-label="Инструкция">📖</button></header>
  <div class="body" id="robBody"></div>
  <nav class="robnav" id="robNav" hidden></nav>
</section>

<!-- сканер бумаг -->
<section class="sheet" id="scanner" hidden>
  <header><button class="icon" data-close="scanner" aria-label="Назад">←</button><b>Сканер бумаг</b><button class="icon" data-man="scan" aria-label="Инструкция">📖</button></header>
  <div class="body" id="scanBody"></div>
</section>

<!-- настройки -->
<section class="sheet" id="settings" hidden>
  <header><button class="icon" data-close="settings" aria-label="Назад">←</button><b>Настройки</b><span id="setVer" class="mut" style="font-size:13px"></span><button id="manBtn" data-man="settings">📖 Инструкция</button></header>
  <div class="stabs" id="setTabs" role="tablist"></div>
  <div class="body" id="setBody"></div>
</section>

<!-- инструкция (3.8): та же страница, что manual/Инструкция.html -->
<section class="sheet" id="manual" hidden>
  <header><button class="icon" data-close="manual" aria-label="Назад">←</button><b>📖 Инструкция</b></header>
  <iframe id="manFrame" title="Инструкция"></iframe>
</section>

<script src="engine2.js"></script>
<script src="divs.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
